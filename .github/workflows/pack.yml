name: Generate content pack
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Recalculer toutes les traductions (ignore l'ancien pack)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - name: Generate pack
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: python tools/make_pack.py ${{ inputs.refresh && '--refresh' || '' }}
      - name: Commit pack
        run: |
          git config user.name "pack-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pack
          git commit -m "Update content pack" || echo "rien à commiter"
          git pull --rebase
          git push
